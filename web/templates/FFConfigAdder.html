<!DOCTYPE html>
<html lang="eng"></html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>FlipFlop Config Adder</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='FFConfigAdderPro.css') }}">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Varela+Round&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    </head>
    <body>
        <h1 class="title">Add a Flip-Flop Configuration</h1>
        <form method = "POST" action ="/FFConfigAdder">
            
            <div id="NameInput" class = "inputCard">
                <h3 class="inputLabel">Enter the Name of the Flip-Flop</h3>
                <input class = "inputBar" id = "flipflopName" type="text" name="flipflpName" placeholder="Enter Name">
            </div>

            <div id="countBlock" class = "inputCard">
                <h3 class="inputLabel">Enter the Number of Control Lines</h3>
                <input class = "inputBar" id = "controlLineCount" type="number" min="1" max="3" name="controlLineCount" placeholder="..." onchange="generateTable()">
                
                <h3 class="inputLabel">Enter Their Names</h3>
                <input class = "inputBar" id = "VarNames" type="text" name="VarNames" placeholder="Enter comma seperated names">
            </div>

            <div id="configBlock" class = "inputCard">
                <h1>Table</h1>
                <div id="configTableBlock">
                    <p>Enter The Number Of Control Lines First ⚠️</p>
                </div>
            </div>
            <button id ="submitButton" type = "submit">Add your Creation</button>

        </form>

        <div id = "overlay">
            <div id="popup" data-problem="{{ problem }}" data-success = "Your creation was successfully added" >
                
            </div>
        </div>
        
        
        <script>
            function generateTable(){
                const container = document.getElementById("configTableBlock");
                const controlLineCount = parseInt(document.getElementById("controlLineCount").value);
                container.innerHTML = "";
                const table = document.createElement("table");
                table.id = "configTable";
                const header = document.createElement("tr");
                let arr = ["Current", "Next"]
                for(let i = 1; i <= controlLineCount; i++){
                    arr.push(("Var" + i));
                }
                arr.forEach(label => {const labelEle = document.createElement("th");
                                        labelEle.textContent = label;
                                        header.appendChild(labelEle);
                                        });

                table.appendChild(header);

                for(let current = 0; current <= 1; current++){
                    for(let next = 0; next <= 1; next++){
                        const row = document.createElement("tr");
                        
                        const currStateRowEle = document.createElement("td");
                        currStateRowEle.textContent = current.toString();
                        
                        const nextSateRowEle = document.createElement("td");
                        nextSateRowEle.textContent = next.toString();

                        row.appendChild(currStateRowEle);
                        row.appendChild(nextSateRowEle);

                        for(let idx = 1; idx <= controlLineCount; idx++){
                            const controlLineRowEle = document.createElement("td");
                            const input = document.createElement("input");
                            input.type = "text";
                            input.maxLength = 1;
                            input.name = "Var" + idx +"_Current" + current + "_Next" + next;
                            input.defaultValue = "0";
                            controlLineRowEle.appendChild(input);
                            row.appendChild(controlLineRowEle);
                        }


                        table.appendChild(row);

                    }
                }
                container.classList.add("generated");
                container.appendChild(table);
            }
            let showPopUp = function(Type){
                const overlay = document.getElementById("overlay");
                overlay.classList.add("blurred");
                const popup = document.getElementById("popup");
                
                const title = document.createElement("h2");
                title.textContent = (Type == "problem")?"An Issue Occured ❌":"Success ✅";
                popup.appendChild(title)

                const details = document.createElement("h3");
                let problemText = popup.dataset.problem;
                let successText = popup.dataset.success;
                if(Type == "problem"){
                    title.style.color = "crimson" ;
                    details.textContent = problemText;
                }
                else {
                    title.style.color = "green";
                    details.textContent = successText;
                }
                popup.appendChild(details);

                popup.classList.add("visible");
                setTimeout(() => {
                                    popup.classList.remove("visible");
                }, 2000); 
                setTimeout(() => {
                                    overlay.classList.remove("blurred");
                }, 2500); 
                
            }
        </script>

        {%if submit%}  
            {%if problem %}
            <script>
                showPopUp("problem");
            </script>
            {%else%}
            <script>
                showPopUp("success");
            </script>
            {%endif%}
        {%endif%}

    </body>

</html>
